<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar – OrçaTech</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6fb;color:#1a2040;font:16px Arial,sans-serif}
    main{width:min(420px,calc(100% - 32px));padding:36px;background:#fff;border:1px solid #d4d9ef;border-radius:18px;box-shadow:0 12px 40px #1e2a6e18}
    h1{margin:0 0 8px;color:#1e2a6e}p{color:#6070a8}label{display:block;margin:18px 0 6px;font-weight:600}
    input{width:100%;padding:12px;border:1px solid #b8c0e0;border-radius:8px;font:inherit}
    button{width:100%;margin-top:24px;padding:12px;border:0;border-radius:8px;background:#2d3a8c;color:#fff;font:700 16px Arial,sans-serif;cursor:pointer}
    .erro{padding:10px;border-radius:8px;background:#fee2e2;color:#991b1b}
  </style>
</head>
<body>
  <main>
    <h1>OrçaTech</h1>
    <p>Entre com sua conta para continuar.</p>
    {% if erro %}<p class="erro" role="alert">{{ erro }}</p>{% endif %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="username" required autofocus>
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
